<!-- ═══════════════════════════════════════════════════════════════
     课件壳（占位符模板）：**不要手工拷贝这个文件**，正文也不写在这里。
     ═══════════════════════════════════════════════════════════════
     产出课件的那条命令（讲解角色写内容、出题角色写题库，HTML 由渲染器产出）：
       python3 <root>/scripts/render_lesson.py <科目目录> <节点id>
     写出的 <科目>/lessons/<序号>-<节点id>.html 才是课件；内容格式见 docs/课件内容格式.md。

     渲染器从大纲（<科目>/curriculum.yaml）算出的部分：文件名序号、上/下节课指针、页头 eyebrow。
     本文件只给工程外壳：共享层与科目组件的引用、顶栏与主题开关、提问提示、页脚、三个 script。

     占位符（约定与 gen_home.py 一致：写成 HTML 注释里的 @LEARN:NAME；缺一个就报错，
     不许静默残缺。注释里不能嵌套注释，所以这一行不写完整写法）：
       TITLE    <title> 与 <h1>（出现两次）
       SUBJECT  <title> 与顶栏（出现两次）
       NUMBER   顶栏编号（0005）
       EYEBROW  页头那行 `序号 · 节点标题`
       GOAL     .lesson-goal 里「本节目标：」后面那句话
       BODY     正文（渲染器按内容文件产出）
       NAV      上/下节课指针（第一课无 --prev、最后一课无 --next）
       FOOTER   页脚那行
     必须保留（改丢会被检查判 FAIL）：顶部三条样式引用（共享层 ../../../assets/ + 科目 ../assets/）、
     底部三条脚本引用、主题开关 id="lesson-theme-checkbox" 与 LearnTheme.wire(...) 接线、.lesson-ask。
     产出的课件提交前跑一次检查：
       python3 <root>/scripts/check_lesson.py <课件路径> --subject <科目目录> --node <节点id>

     ⚠ 这段说明是给维护者看的：它留在 <!DOCTYPE html> **之前**，渲染器只从 <!DOCTYPE 起取内容，
     所以不随课件出厂——学生查看页面源码时读不到这段写给模型的说明。
     ═══════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- @LEARN:TITLE --> · <!-- @LEARN:SUBJECT --></title>

<!-- 共享层在 .learning/assets/，课件在 .learning/subjects/<slug>/lessons/ 下，所以是 ../../../assets/ -->
<link rel="stylesheet" href="../../../assets/sayo/sayo.css">
<link rel="stylesheet" href="../../../assets/learn-theme.css">
<link rel="stylesheet" href="../assets/style.css">

<!-- 主题要在首帧前应用，避免闪白/闪黑 -->
<script src="../../../assets/learn-theme.js"></script>
<script>LearnTheme.apply();</script>
</head>

<body class="lesson-body">

<nav class="lesson-bar">
  <a href="../index.html">← 返回课程</a>
  <span><!-- @LEARN:SUBJECT --></span>
  <span class="lesson-bar__no"><!-- @LEARN:NUMBER --></span>
  <!-- 课件页自带主题开关：学生从文件管理器直接打开课件时也能切暗色 -->
  <label class="syo-toggle syo-toggle--theme lesson-bar__toggle" title="切换深浅主题" aria-label="切换深浅主题">
    <input type="checkbox" id="lesson-theme-checkbox" checked>
    <span class="syo-toggle-track"></span>
    <span class="syo-toggle-knob">
      <svg class="syo-toggle-sun" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.5" stroke="#f57c00" stroke-width="1.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.34 4.34l1.77 1.77M13.89 13.89l1.77 1.77M4.34 15.66l1.77-1.77M13.89 6.11l1.77-1.77" stroke="#f57c00" stroke-width="1.2" stroke-linecap="round"/></svg>
      <svg class="syo-toggle-moon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.5 12.5A6 6 0 019 4.5a6 6 0 007.5 8z" stroke="#5c6bc0" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </span>
  </label>
</nav>

<article class="lesson">

  <header class="lesson-header">
    <span class="lesson-header__eyebrow"><!-- @LEARN:EYEBROW --></span>
    <h1><!-- @LEARN:TITLE --></h1>
    <p class="lesson-goal"><b>本节目标：</b><!-- @LEARN:GOAL --></p>
  </header>

  <!-- ── 正文：渲染器按内容文件（lessons/<序号>-<节点id>.md）产出，块词汇见 docs/课件内容格式.md ── -->

<!-- @LEARN:BODY -->

  <!-- ── 提问提示：固定写法，别删 ── -->

  <div class="lesson-ask">
    <b>没看懂？随时问</b>
    把看不懂的段落（或报错）原样复制回会话，说一句哪里不懂就行，我只解释这一段，不打断你的进度。
  </div>

  <!-- ── 上/下节课指针由渲染器按 curriculum.yaml 的 nodes 顺序算（第一课无 --prev、最后一课无 --next） ── -->

<!-- @LEARN:NAV -->

  <footer class="lesson-footer">
    <!-- @LEARN:FOOTER -->
  </footer>

</article>

<script src="../../../assets/sayo/sayo.js"></script>
<!-- @LEARN:MATH -->
<script src="../assets/quiz.js" defer></script>
<script src="../assets/lesson-toc.js" defer></script>
<script>LearnTheme.wire(document.getElementById('lesson-theme-checkbox'));</script>
</body>
</html>
