# 误解与卡点日志：按时间追加，不做整篇重写（字段口径见 local-qa）
# 与 progress.yaml 的 misconceptions 一一对得上：同一次记录在两处都写一份。

- topic: 线性相关与解的存在性
  question: 第 1 课练习里那个两列成比例的方程组，不是应该有无穷多解吗？
  misunderstanding: 把「列向量线性相关」当成了「有无穷多解」的充分条件，忘了还要看右端项在不在列向量的张成里
  answer_summary: 相关只说明拼法不唯一；能拼出来才有无穷多解，拼不出来照样无解。两步分开做——先看 b 在不在张成里，再看拼法是否唯一。
  follow_up: 固定两列为 (1, 2) 与 (2, 4)，把 b 分别取 (3, 6) 与 (3, 7) 各算一次，说出两次结论差在哪一步
  importance: high

- topic: 零空间维数
  question: A = [[1,2],[2,4]] 有两行，那零空间的维数不是 2 吗？
  misunderstanding: 把秩-零化度定理记成了「行数 − 秩」，而右边应该是列数（未知量个数、输入空间的维数）
  answer_summary: 用列数：2 − 1 = 1。解 x + 2y = 0 得 (x, y) = t·(−2, 1)，是一条过原点的直线，维数确实是 1。
  follow_up: 换成 3 列的矩阵 [[1,2,3],[2,4,6]] 重算一遍零空间维数，并写出两个基向量
  importance: high

- topic: 消元时右端项没有同步
  question: 手算 3×3 方程组时，第 3 行除以 5 之后右边为什么对不上？
  misunderstanding: 把初等行变换只作用在系数部分，忘了增广矩阵的最后一列是同一行的一部分，必须一起变
  answer_summary: 行变换作用在整行上：系数与右端项同步做同样的操作。把右端项写进增广矩阵、每一步都从上一行抄下来，这类错就少一半。
  follow_up: 在 lab 里让 solve 返回解之后，用手算的解去核对；再故意漏掉一步右端的同步，看断言会不会抓到
  importance: medium
