name: Release
run-name: Release (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: studymate-release-main
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'Miaotofu01/Study-Mate' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUMP: ${{ inputs.bump }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install plugin build dependency
        run: python -m pip install PyYAML
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11 --ignore-scripts
      - name: Prepare changelog, version commit and tag
        run: node scripts/release/release.mjs prepare
      - name: Build plugin ZIP, publish npm through OIDC, and attach ZIP to GitHub Release
        run: node scripts/release/release.mjs publish
